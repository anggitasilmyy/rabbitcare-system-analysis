<text text-anchor="middle" x="593.5" y="-320.2" font-family="Arial" font-size="11.00" fill="#14243a">3. CALLBACK &amp; VERIFICATION</text>
<text text-anchor="middle" x="593.5" y="-295.2" font-family="Arial" font-size="11.00" fill="#14243a">Backend receives a provider callback / webhook</text>
<text text-anchor="middle" x="593.5" y="-283.2" font-family="Arial" font-size="11.00" fill="#14243a">or a server&#45;side status inquiry.</text>
<text text-anchor="middle" x="593.5" y="-258.2" font-family="Arial" font-size="11.00" fill="#14243a">It verifies provider authentication and matches the</text>
<text text-anchor="middle" x="593.5" y="-246.2" font-family="Arial" font-size="11.00" fill="#14243a">provider reference, invoice, amount, currency and event.</text>
<text text-anchor="middle" x="593.5" y="-221.2" font-family="Arial" font-size="11.00" fill="#14243a">Duplicate events are idempotent. Invalid or unmatched</text>
<text text-anchor="middle" x="593.5" y="-209.2" font-family="Arial" font-size="11.00" fill="#14243a">events are recorded without settling the invoice.</text>
</g>
