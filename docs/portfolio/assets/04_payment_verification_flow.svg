<text text-anchor="middle" x="1025.5" y="-320.2" font-family="Arial" font-size="11.00" fill="#14243a">4. SETTLEMENT &amp; RECONCILIATION</text>
<text text-anchor="middle" x="1025.5" y="-295.2" font-family="Arial" font-size="11.00" fill="#14243a">Verified success + unpaid invoice:</text>
<text text-anchor="middle" x="1025.5" y="-283.2" font-family="Arial" font-size="11.00" fill="#14243a">Payment = PAID; Invoice = LUNAS; issue one receipt.</text>
<text text-anchor="middle" x="1025.5" y="-258.2" font-family="Arial" font-size="11.00" fill="#14243a">Verified pending / failed / cancelled:</text>
<text text-anchor="middle" x="1025.5" y="-246.2" font-family="Arial" font-size="11.00" fill="#14243a">update the Payment attempt only; Invoice stays unpaid.</text>
<text text-anchor="middle" x="1025.5" y="-221.2" font-family="Arial" font-size="11.00" fill="#14243a">If another attempt already settled the invoice,</text>
<text text-anchor="middle" x="1025.5" y="-209.2" font-family="Arial" font-size="11.00" fill="#14243a">record an exception and reconcile; no second receipt.</text>
</g>
