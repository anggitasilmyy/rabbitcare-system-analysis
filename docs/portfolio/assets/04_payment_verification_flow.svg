<text text-anchor="middle" x="593.5" y="-520.7" font-family="Arial" font-size="11.00" fill="#14243a">2. PROVIDER INTERACTION</text>
<text text-anchor="middle" x="593.5" y="-495.7" font-family="Arial" font-size="11.00" fill="#14243a">Payment Gateway Adapter requests a hosted checkout.</text>
<text text-anchor="middle" x="593.5" y="-483.7" font-family="Arial" font-size="11.00" fill="#14243a">Owner completes payment with the provider.</text>
<text text-anchor="middle" x="593.5" y="-458.7" font-family="Arial" font-size="11.00" fill="#14243a">A timeout / unknown outcome keeps the attempt PENDING;</text>
<text text-anchor="middle" x="593.5" y="-446.7" font-family="Arial" font-size="11.00" fill="#14243a">status inquiry or exception handling is required.</text>
<text text-anchor="middle" x="593.5" y="-434.7" font-family="Arial" font-size="11.00" fill="#14243a">A definite checkout creation failure is recorded as</text>
<text text-anchor="middle" x="593.5" y="-422.7" font-family="Arial" font-size="11.00" fill="#14243a">an exception and must never be marked PAID.</text>
</g>
