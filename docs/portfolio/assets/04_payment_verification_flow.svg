<text text-anchor="middle" x="650.75" y="-559" font-family="Arial" font-size="20.00" fill="#14243a">PAYMENT GATEWAY | VERIFIED RESULT &amp; IDEMPOTENT PROCESSING</text>
<!-- S1 -->
<g id="node1" class="node">
<title>S1</title>
<path fill="#eef5ff" stroke="#7fa6d8" stroke-width="1.35" d="M305,-549C305,-549 12,-549 12,-549 6,-549 0,-543 0,-537 0,-537 0,-412 0,-412 0,-406 6,-400 12,-400 12,-400 305,-400 305,-400 311,-400 317,-406 317,-412 317,-412 317,-537 317,-537 317,-543 311,-549 305,-549"/>
<text text-anchor="middle" x="158.5" y="-527.2" font-family="Arial" font-size="11.00" fill="#14243a">1. PAYMENT INITIATION</text>
<text text-anchor="middle" x="158.5" y="-502.2" font-family="Arial" font-size="11.00" fill="#14243a">Owner opens their invoice and submits a request</text>
<text text-anchor="middle" x="158.5" y="-490.2" font-family="Arial" font-size="11.00" fill="#14243a">with an Idempotency&#45;Key.</text>
<text text-anchor="middle" x="158.5" y="-465.2" font-family="Arial" font-size="11.00" fill="#14243a">System validates invoice ownership, outstanding</text>
<text text-anchor="middle" x="158.5" y="-453.2" font-family="Arial" font-size="11.00" fill="#14243a">amount and currency, then creates a Payment attempt</text>
<text text-anchor="middle" x="158.5" y="-441.2" font-family="Arial" font-size="11.00" fill="#14243a">with status PENDING.</text>
<text text-anchor="middle" x="158.5" y="-416.2" font-family="Arial" font-size="11.00" fill="#14243a">A repeated key returns the existing attempt.</text>
</g>
